name: Publish

on:
  push:
    tags: ['v*']

# O runner não tem identidade de git: sem isto, os testes que fazem
# `git commit` falham com "Author identity unknown".
env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@snakit.dev
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@snakit.dev

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # Falha cedo e com mensagem clara antes de chegar no npm publish.
      - name: Confere tag x package.json e NPM_TOKEN
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} não bate com package.json ${PKG_VERSION}"
            exit 1
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Segredo NPM_TOKEN não configurado"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
