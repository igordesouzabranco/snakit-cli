name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Permissão mínima: o CI só precisa ler o código.
permissions:
  contents: read

# O runner não tem identidade de git: sem isto, os testes que fazem
# `git commit` falham com "Author identity unknown".
env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@snakit.dev
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@snakit.dev

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
